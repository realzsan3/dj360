<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJI 360° 全景查看器</title>
<style>
:root{--bg:#0b0d10;--fg:#e8eaed;--mut:#8a919b;--acc:#3ea6ff;--panel:rgba(20,24,30,.72)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b0d10}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#view{position:fixed;inset:0;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
canvas{display:block}
#drop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#drop.hide{display:none}
.box{border:2px dashed #3a424d;border-radius:18px;padding:48px 64px;max-width:90vw;transition:.2s}
.box.over{border-color:var(--acc);background:rgba(62,166,255,.08)}
h1{font-size:22px;margin:0 0 6px;font-weight:600}
p{margin:4px 0;color:var(--mut);font-size:14px}
button{background:var(--acc);color:#04121f;border:0;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px}
#bar{position:fixed;top:12px;right:12px;display:none;gap:8px;z-index:5}
#bar button{margin:0;background:var(--panel);color:var(--fg);backdrop-filter:blur(8px);padding:8px 14px;font-weight:500}
#bar button:hover{background:rgba(62,166,255,.35)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(8px);padding:10px 18px;border-radius:10px;font-size:13px;max-width:80vw;display:none;z-index:6}
#toast.err{color:#ff8a80}
#load{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-size:15px;z-index:7}
#info{position:fixed;top:56px;right:12px;width:260px;max-height:calc(100% - 120px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border-radius:12px;padding:12px 14px;font-size:13px;display:none;z-index:5}
#info h2{margin:0 0 8px;font-size:13px;color:var(--acc);font-weight:600}
#info .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#info .r span:first-child{color:var(--mut);white-space:nowrap}
#info .r span:last-child{text-align:right;word-break:break-all}
#info .big{font-size:15px;font-weight:600;color:var(--fg)}
#info .note{color:var(--mut);font-size:12px;margin-top:8px;line-height:1.5}
#hint{position:fixed;left:14px;bottom:12px;font-size:12px;color:var(--mut);display:none}
</style>
</head>
<body>
<div id="view"></div>
<div id="drop"><div class="box" id="box">
  <h1>DJI 360° 全景查看器</h1>
  <p>将 DJI Fly 导出的全景 JPG 拖到这里</p>
  <p>图片仅在本地浏览器处理，不会上传</p>
  <button id="pick">选择图片</button>
</div></div>
<div id="bar">
  <button id="infoBtn">信息</button>
  <button id="rot">自动旋转</button>
  <button id="reset">复位</button>
  <button id="fs">全屏</button>
  <button id="again">换一张</button>
</div>
<div id="info"></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 双击全屏 · 空格自动旋转 · I 信息</div>
<div id="toast"></div>
<div id="load">正在解码图片…</div>
<input type="file" id="file" accept=".jpg,.jpeg,image/jpeg" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
const $=id=>document.getElementById(id);
const view=$('view'),toastEl=$('toast');
let renderer,scene,camera,mesh,tex,lon=0,lat=0,vLon=0,vLat=0,fov=75,auto=false,dragging=false,px=0,py=0,loaded=false;

function toast(msg,err,ms=4000){toastEl.textContent=msg;toastEl.className=err?'err':'';toastEl.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.style.display='none',ms)}

function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  view.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(fov,innerWidth/innerHeight,.1,1100);
  animate();
}

// 读取文件头 XMP GPano 信息
async function readGPano(file){
  const buf=await file.slice(0,256*1024).arrayBuffer();
  const s=new TextDecoder('latin1').decode(buf);
  if(!s.includes('GPano'))return null;
  const g=k=>{const m=s.match(new RegExp('GPano:'+k+'(?:="|>)([^"<]+)'));return m?m[1]:null};
  return {proj:g('ProjectionType'),fullW:+g('FullPanoWidthPixels')||0,fullH:+g('FullPanoHeightPixels')||0,cropW:+g('CroppedAreaImageWidthPixels')||0,cropH:+g('CroppedAreaImageHeightPixels')||0};
}

async function loadFile(file){
  if(!file)return;
  if(!/\.(jpe?g)$/i.test(file.name)&&file.type!=='image/jpeg'){toast('仅支持 JPG / JPEG 格式的全景图片',true);return}
  $('load').style.display='flex';
  await new Promise(r=>setTimeout(r,30));
  try{
    const meta=await readGPano(file);
    let bmp;
    try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
    catch(e){throw new Error('无法解码该图片，文件可能已损坏，请重新从 DJI Fly 导出')}
    const W=bmp.width,H=bmp.height,ratio=W/H;
    let notes=[];
    if(meta&&meta.cropW&&meta.fullW&&meta.cropW<meta.fullW*0.98){
      throw new Error('检测到这是局部/广角全景（非完整 360°），当前版本暂不支持，请选择完整 360° 球形全景');
    }
    if(!meta)notes.push('未检测到全景元数据，已按标准全景处理');
    if(Math.abs(ratio-2)>0.05){
      if(!meta||meta.proj!=='equirectangular'){
        if(!confirm(`图片比例为 ${ratio.toFixed(2)}:1，不是标准 2:1 全景，画面可能变形。仍要查看吗？`)){bmp.close();$('load').style.display='none';return}
      }
      notes.push('图片比例非 2:1，画面可能拉伸');
    }
    // 适配 GPU 纹理上限
    const gl=renderer.getContext();
    const maxTex=gl.getParameter(gl.MAX_TEXTURE_SIZE);
    let tw=Math.min(W,maxTex,16384);
    let canvas,ok=false;
    while(!ok&&tw>=2048){
      const th=Math.round(tw/ratio);
      try{
        canvas=document.createElement('canvas');canvas.width=tw;canvas.height=th;
        const c=canvas.getContext('2d');
        if(!c)throw 0;
        c.imageSmoothingQuality='high';c.drawImage(bmp,0,0,tw,th);ok=true;
      }catch(e){tw=Math.floor(tw/2);canvas=null}
    }
    bmp.close();
    if(!ok)throw new Error('图片过大，浏览器内存不足，无法加载');
    if(tw<W)notes.push(`已将 ${W}px 宽图降采样为 ${tw}px 以适配显卡`);
    build(canvas);
    renderInfo(await readInfo(file,W,H));
    $('drop').classList.add('hide');$('bar').style.display='flex';$('hint').style.display='block';
    loaded=true;resetView();
    if(notes.length)toast(notes.join('；'),false,6000);
  }catch(e){
    toast(e.message||'加载失败',true,6000);
  }finally{$('load').style.display='none'}
}


// 读取 EXIF + DJI XMP 参数
async function readInfo(file,W,H){
  let ex={};
  try{ex=await exifr.parse(file,{gps:true,tiff:true,exif:true,xmp:false})||{}}catch(e){}
  const s=new TextDecoder('latin1').decode(await file.slice(0,256*1024).arrayBuffer());
  const d=k=>{const m=s.match(new RegExp('drone-dji:'+k+'(?:="|>)([^"<]+)'));return m?parseFloat(m[1]):null};
  const m=(v,u,n=1)=>v==null||isNaN(v)?null:v.toFixed(n)+u;
  const a=[],b=[];
  const rel=d('RelativeAltitude'),abs=d('AbsoluteAltitude');
  const lat=ex.latitude??d('GpsLatitude'),lon=ex.longitude??d('GpsLongitude');
  if(rel!=null)a.push(['相对高度',m(rel,' m'),1]);
  if(abs!=null)a.push(['海拔高度',m(abs,' m')]);
  else if(ex.GPSAltitude!=null)a.push(['海拔高度',m(ex.GPSAltitude,' m')]);
  if(lat!=null&&lon!=null)a.push(['经纬度',lat.toFixed(6)+', '+lon.toFixed(6)]);
  const gy=d('GimbalYawDegree'),gp=d('GimbalPitchDegree'),fy=d('FlightYawDegree');
  if(gy!=null)a.push(['云台偏航',m(gy,'°')]);
  if(gp!=null)a.push(['云台俯仰',m(gp,'°')]);
  if(fy!=null)a.push(['机头朝向',m(fy,'°')]);
  const dt=ex.DateTimeOriginal||ex.CreateDate;
  if(ex.Model)b.push(['机型',(ex.Make&&!ex.Model.includes(ex.Make)?'':'')+ex.Model]);
  if(dt instanceof Date)b.push(['拍摄时间',dt.toLocaleString('zh-CN')]);
  if(ex.ExposureTime)b.push(['快门',ex.ExposureTime<1?'1/'+Math.round(1/ex.ExposureTime)+' s':ex.ExposureTime+' s']);
  if(ex.FNumber)b.push(['光圈','f/'+ex.FNumber]);
  if(ex.ISO)b.push(['ISO',String(ex.ISO)]);
  if(ex.FocalLength)b.push(['焦距',ex.FocalLength+' mm']);
  b.push(['分辨率',`${W} × ${H}（${(W*H/1e6).toFixed(1)} MP）`]);
  b.push(['文件大小',(file.size/1048576).toFixed(1)+' MB']);
  return {flight:a,photo:b};
}
function renderInfo({flight,photo}){
  const box=$('info');box.textContent='';
  const sec=(t,rows)=>{
    const h=document.createElement('h2');h.textContent=t;box.appendChild(h);
    rows.forEach(([k,v,big])=>{
      const r=document.createElement('div');r.className='r';
      const x=document.createElement('span');x.textContent=k;
      const y=document.createElement('span');y.textContent=v;if(big)y.className='big';
      r.append(x,y);box.appendChild(r);
    });
  };
  if(flight.length)sec('飞行参数',flight);
  else{const n=document.createElement('div');n.className='note';n.textContent='未找到高度、位置等飞行参数。全景合成后的图片可能没有保留这些信息。';box.appendChild(n)}
  const sp=document.createElement('div');sp.style.height='10px';box.appendChild(sp);
  sec('拍摄信息',photo);
}
function toggleInfo(){if(!loaded)return;const i=$('info');i.style.display=i.style.display==='block'?'none':'block'}
$('infoBtn').onclick=toggleInfo;

function build(canvas){
  if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.map&&mesh.material.map.dispose();mesh.material.dispose()}
  tex=new THREE.CanvasTexture(canvas);
  tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=false;
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const geo=new THREE.SphereGeometry(500,96,64);geo.scale(-1,1,1);
  mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex}));
  scene.add(mesh);
}

function resetView(){lon=0;lat=0;fov=75;vLon=vLat=0;camera.fov=fov;camera.updateProjectionMatrix()}

function animate(){
  requestAnimationFrame(animate);
  if(!loaded)return;
  if(auto&&!dragging)lon+=0.08;
  if(!dragging){lon+=vLon;lat+=vLat;vLon*=0.93;vLat*=0.93}
  lat=Math.max(-89,Math.min(89,lat));
  const phi=THREE.MathUtils.degToRad(90-lat),theta=THREE.MathUtils.degToRad(lon);
  camera.lookAt(Math.sin(phi)*Math.cos(theta),Math.cos(phi),Math.sin(phi)*Math.sin(theta));
  camera.fov+=(fov-camera.fov)*0.2;camera.updateProjectionMatrix();
  renderer.render(scene,camera);
}

// 交互：指针事件（鼠标 + 触摸通用）
view.addEventListener('pointerdown',e=>{if(!loaded)return;dragging=true;px=e.clientX;py=e.clientY;vLon=vLat=0;view.classList.add('drag');view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const k=camera.fov/innerHeight*1.0;
  const dx=(e.clientX-px)*k,dy=(e.clientY-py)*k;
  lon-=dx;lat+=dy;vLon=-dx;vLat=dy;px=e.clientX;py=e.clientY;
});
const end=()=>{dragging=false;view.classList.remove('drag')};
view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
view.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(20,Math.min(110,fov+e.deltaY*0.05))},{passive:false});
view.addEventListener('dblclick',toggleFS);
addEventListener('resize',()=>{if(!renderer)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggleAuto()}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='i'||e.key==='I')toggleInfo();
});

function toggleFS(){
  if(!loaded)return;
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>toast('当前浏览器不支持全屏',true));
}
function toggleAuto(){auto=!auto;$('rot').textContent=auto?'停止旋转':'自动旋转'}

// 上传
const fileIn=$('file');
$('pick').onclick=()=>fileIn.click();
$('again').onclick=()=>fileIn.click();
fileIn.onchange=()=>{loadFile(fileIn.files[0]);fileIn.value=''};
$('rot').onclick=toggleAuto;$('reset').onclick=resetView;$('fs').onclick=toggleFS;
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();$('box').classList.add('over')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();$('box').classList.remove('over')}));
addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});

init();
</script>
</body>
</html>
